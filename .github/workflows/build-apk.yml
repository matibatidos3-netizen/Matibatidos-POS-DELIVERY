name: Construir APK Matibatidos Online

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'app/**'
      - 'backend/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar aplicación Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Verificar estructura
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/matibatidos/online/MainActivity.java
          test -f app/src/main/assets/www/index.html
          test -f backend/Code.gs

          echo "Estructura del proyecto verificada."

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::No se generó la APK."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-Online-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
