name: Matibatidos RC6 - Excel y rendimiento

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Matibatidos RC6
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer y localizar proyecto Android
        id: locate
        shell: bash
        run: |
          set -e
          ZIP="Matibatidos_RC6_EXCEL_RENDIMIENTO_CORREGIDO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró $ZIP en la raíz del repositorio."
            ls -la
            exit 1
          fi

          mkdir -p extracted_project
          unzip -oq "$ZIP" -d extracted_project

          SETTINGS=$(find extracted_project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle."
            find extracted_project -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Proyecto localizado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verificar estructura e identificador independiente
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          test -f build.gradle || test -f build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/java/com/matibatidos/pos/rc6/MainActivity.java

          if ! grep -Eq "applicationId[[:space:]]*['\"]com\.matibatidos\.pos\.rc6['\"]" app/build.gradle; then
            echo "ERROR: applicationId independiente no coincide."
            exit 1
          fi

          echo "Estructura e identificador verificados."

      - name: Incluir bibliotecas JavaScript para Excel y gráficos
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          ASSETS="app/src/main/assets"
          mkdir -p "$ASSETS"

          echo "Descargando SheetJS 0.20.3..."
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" \
            --output "$ASSETS/xlsx.full.min.js"

          echo "Descargando Chart.js 4.4.7..."
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" \
            --output "$ASSETS/chart.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/chart.umd.min.js"
          echo "Bibliotecas incluidas:"
          ls -lh "$ASSETS/xlsx.full.min.js" "$ASSETS/chart.umd.min.js"

      - name: Preparar SDK Android
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: No se encontró Android SDK en $SDK_ROOT."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f \
            -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verificar APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: No se generó una APK válida."
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publicar APK independiente
        uses: actions/upload-artifact@v4
        with:
          name: Matibatidos-POS-RC6-EXCEL-OPTIMIZADO
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
